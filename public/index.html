<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login | Callisto-Orbit Fund Management</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="/assets/images/callisto-logo.jpg">

  <!-- Google Fonts: Inter & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Callisto-Orbit Cyber & Glassmorphic CSS -->
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Ambient Glowing Orbs -->
  <div class="glow-orb-top"></div>
  <div class="glow-orb-bottom"></div>

  <!-- Main Login View Container -->
  <main class="auth-wrapper">
    <div class="glass-panel glass-panel-accent auth-card">
      
      <!-- Callisto Brand Header -->
      <header class="brand-header">
        <div class="brand-logo-wrap">
          <img src="/assets/images/callisto-logo.jpg" alt="Callisto Logo" class="brand-logo-img">
        </div>
        <h1 class="brand-title">Callisto Orbit</h1>
        <p class="brand-subtitle">Team Fund & Monthly Collection Pool</p>
        <span class="brand-badge">
          <i class="bi bi-shield-lock-fill me-1"></i> Cyber Security &amp; AI
        </span>
      </header>

      <!-- Alert / Notification Placeholder -->
      <div id="alertContainer"></div>

      <!-- Login Form -->
      <form id="loginForm" autocomplete="off">
        
        <!-- Username / Email Input -->
        <div class="form-group-custom">
          <label for="identifier" class="form-label-custom">
            <span>Username or Work Email</span>
            <span class="text-dim fs-7">Team ID</span>
          </label>
          <div class="input-glass-wrap">
            <i class="bi bi-person-fill input-icon-left"></i>
            <input 
              type="text" 
              class="input-glass" 
              id="identifier" 
              placeholder="e.g. kehan or kehan@callisto.io" 
              required 
              autofocus
            >
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group-custom">
          <label for="password" class="form-label-custom">
            <span>Password</span>
            <span class="text-dim fs-7">Encrypted</span>
          </label>
          <div class="input-glass-wrap">
            <i class="bi bi-key-fill input-icon-left"></i>
            <input 
              type="password" 
              class="input-glass" 
              id="password" 
              placeholder="Enter your security password" 
              required
            >
            <button type="button" class="input-btn-right" id="togglePassword" title="Toggle password visibility" aria-label="Toggle password visibility">
              <i class="bi bi-eye-fill" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <!-- Options: Remember Me & Security Note -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <label class="custom-check">
            <input type="checkbox" id="rememberMe">
            <span>Remember identity</span>
          </label>
          <span class="text-dim" style="font-size: 0.78rem;">
            <i class="bi bi-lock-fill text-warning me-1"></i> scrypt 256-bit
          </span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-callisto-primary" id="loginBtn">
          <span>Access Orbit</span>
          <i class="bi bi-arrow-right-short fs-4"></i>
        </button>

      </form>

      <!-- Quick 1-Click Member Test Fill -->
      <section class="demo-accounts-section">
        <div class="demo-title">
          <span><i class="bi bi-people-fill me-1 text-warning"></i> Team Members (1-Click Test)</span>
          <span class="demo-badge">Default: callisto123</span>
        </div>
        <div class="member-pills-grid" id="memberPills">
          <!-- Populated dynamically via JS -->
        </div>
      </section>

      <!-- Footer Info -->
      <footer class="text-center mt-4 pt-2">
        <p class="text-dim mb-0" style="font-size: 0.75rem;">
          Callisto Cyber Security &amp; AI &bull; Orbit Fund Portal &bull; 6 Members &bull; $100/mo
        </p>
      </footer>

    </div>
  </main>

  <!-- Client Auth Logic -->
  <script src="/assets/js/auth.js"></script>
</body>
</html>
