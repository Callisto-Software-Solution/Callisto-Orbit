name: Callisto-Orbit CI/CD Workflow

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Validate Callisto-Orbit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 🔍 Verify Project Structure & JSON Database
        run: |
          test -f data/users.json || { echo "Missing users.json"; exit 1; }
          test -f data/collections.json || { echo "Missing collections.json"; exit 1; }
          test -f data/config.json || { echo "Missing config.json"; exit 1; }
          test -f public/index.html || { echo "Missing index.html"; exit 1; }
          test -f public/login.html || { echo "Missing login.html"; exit 1; }
          test -f public/dashboard.html || { echo "Missing dashboard.html"; exit 1; }

      - name: 🧪 Run Automated Tests & Authentication Checks
        run: npm test

      - name: 🚀 Verify Server Startup Healthcheck
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl -s http://localhost:3000/api/config | grep -q "Callisto-Orbit" || { echo "Server failed config test"; kill $SERVER_PID; exit 1; }
          kill $SERVER_PID
          echo "Server healthcheck passed successfully!"

